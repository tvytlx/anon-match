name = "anon-match-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
workers_dev = true
routes = [{ pattern = "api.wingbot.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "anon-match"
database_id = "9d0fde1b-dafd-44c4-a307-ba2f77946b69"

[vars]
DEV_RETURN_CODE = "false"
REVEAL_TIMEOUT_HOURS = "72"
MAIL_FROM = "noreply@wingbot.app"
TEST_EMAIL = "qq@mail.grokbot.com"
# Turnstile gate before activation emails. Turn "on" only after TURNSTILE_SITE_KEY is set and `wrangler secret put TURNSTILE_SECRET` is done.
HUMAN_CHECK = "off"
TURNSTILE_SITE_KEY = ""

[[send_email]]
name = "EMAIL"

# Short-window per-IP limiter (Workers Rate Limiting binding)
[[ratelimits]]
name = "IP_RL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
